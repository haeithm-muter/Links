<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>روابطي</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Tahoma', 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1e1e2f, #0f0f1a);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 15px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6a5af9, #d54ff7);
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    color: #fff;
    font-weight: bold;
    box-shadow: 0 8px 24px rgba(106,90,249,0.4);
  }
  h1 {
    color: #fff;
    font-size: 22px;
    margin-bottom: 4px;
  }
  p.tagline {
    color: #a9a9c2;
    font-size: 14px;
    margin-bottom: 28px;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  a.link-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px 20px;
    border-radius: 16px;
    color: #fff;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    backdrop-filter: blur(6px);
  }
  a.link-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.35);
  }
  .facebook { background: #1877f2; }
  .instagram { background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af, #515bd4); }
  .whatsapp { background: #25d366; }
  .linkedin { background: #0a66c2; }
  .github { background: #24292f; }
  .website { background: linear-gradient(135deg, #6a5af9, #d54ff7); }
  .icon { font-size: 20px; }
  footer {
    margin-top: 30px;
    color: #6c6c8a;
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">👨‍💻</div>
    <h1>vetrexa</h1>
    <p class="tagline">مطور مواقع وتطبيقات | حلول رقمية للمطاعم والأعمال</p>

    <div class="links">
      <a class="link-btn facebook" href="https://facebook.com/USERNAME" target="_blank">
        <span class="icon">📘</span> فيسبوك
      </a>
      <a class="link-btn instagram" href="https://instagram.com/USERNAME" target="_blank">
        <span class="icon">📸</span> انستغرام
      </a>
      <a class="link-btn whatsapp" href="https://wa.me/9647XXXXXXXXX" target="_blank">
        <span class="icon">💬</span> واتساب
      </a>
      <a class="link-btn linkedin" href="https://linkedin.com/in/USERNAME" target="_blank">
        <span class="icon">💼</span> لينكدإن
      </a>
      <a class="link-btn github" href="https://github.com/USERNAME" target="_blank">
        <span class="icon">🐙</span> جيتهب
      </a>
      <a class="link-btn website" href="https://yourwebsite.com" target="_blank">
        <span class="icon">🌐</span> الموقع الإلكتروني
      </a>
    </div>

    <footer>© 2026 — جميع الحقوق محفوظة</footer>
  </div>
</body>
</html>
